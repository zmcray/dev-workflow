name: ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/guards/date-last-names.test.sh
      - run: bash scripts/guards/swift-swallowed-errors.test.sh
      - run: bash scripts/agent-pitfalls/metrics.test.sh
      - run: bash hooks/stop-fast-check.test.sh
      - run: bash scripts/branch-protection.test.sh

  guards:
    uses: ./.github/workflows/guards.yml
    with:
      guards_ref: ${{ github.event.pull_request.head.sha }}
